---
- name: Set hostname
  hostname:
    name: "{{ hostname | default('new_server') }}"
  when: ansible_hostname != hostname | default('new_server')

- name: Update /etc/hosts with new hostname
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1.*'
    line: "127.0.1.1 {{ hostname | default('new_server') }}"

- name: Install packages
  apt:
    name: "{{ packages }}"
    update_cache: true
  when: packages is defined and packages | length > 0

- include_role:
    name: install_docker

- name: Set SWAP
  block:
    - name: Calculate swap size based on physical memory
      set_fact:
        swap_size_mb: >-
          {% if ansible_memtotal_mb < 2048 %}
            {{ ansible_memtotal_mb * 2 }}
          {% elif ansible_memtotal_mb >= 2048 and ansible_memtotal_mb < 8192 %}
            {{ ansible_memtotal_mb }}
          {% else %}
            {{ ansible_memtotal_mb // 2 }}
          {% endif %}

    - name: Display calculated swap size (for debug)
      debug:
          msg: "Calculated swap size: {{ swap_size_mb }} MB"

    - name: Check if swap file exists
      stat:
        path: /swapfile
      register: swapfile_stat

    - name: Check if swap is active
      command: swapon --show
      register: swapon_checked
      changed_when: false
      failed_when: false

    - name: Disable swap
      command: swapoff /swapfile
      when:
        - swapfile_stat.stat.exists
        - swapon_checked.stdout != ''

    - name: Delete SWAP file
      file:
        path: /swapfile
        state: absent
      when: swapfile_stat.stat.exists

    - name: Create swapfile with calculated size
      command: fallocate -l "{{ swap_size_mb | trim }}M" /swapfile
      args:
        creates: /swapfile

    - name: Create filesystem
      command: mkswap /swapfile

    - name: Set permissions on swapfile
      file:
        path: /swapfile
        mode: "0600"

    - name: Add swap to fstab for auto-mount on reboot
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        create: yes

    - name: Enable SWAP
      command: swapon /swapfile

- include_role:
    name: add_user
  vars:
    sudo_users:
      - your_username
    user_name: "{{ item }}"
    group_name: "{{ item }}"
    key_user: "{{ item }}.pub"
  loop: "{{ sudo_users }}"
  when: sudo_users is defined and sudo_users | length > 0

- name: Check if ntp is installed
  package_facts:

- name: stop ntp service
  service:
    name: ntp
    state: stopped
  when: "'ntp' in ansible_facts.packages"

- name: Disable ntp service
  service:
    name: ntp
    enabled: false
  when: "'ntp' in ansible_facts.packages"

- name: Delete ntp package
  apt:
    name: ntp
    state: absent
  when: "'ntp' in ansible_facts.packages"

- name: Install and run chrony
  apt:
    name: chrony

- name: Start chrony service
  service:
    name: chrony
    state: started

- name: Enable chrony service
  service:
    name: chrony
    enabled: true

- name: Disable root login and password authentication for SSH
  block:
    - name: Disable password authentication for SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regex: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      register: password_auth

    - name: Enable SSH authentication with public key
      lineinfile:
        path: /etc/ssh/sshd_config
        regex: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      register: pubkey_auth

    - name: Disable root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitRootLogin\s'
        line: 'PermitRootLogin no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      register: root_login

    - name: Restart SSH service
      service:
        name: ssh
        state: restarted
      when: password_auth.changed or pubkey_auth.changed or root_login.changed
